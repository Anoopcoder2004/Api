<div class="container mt-4">

  <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Rating</th>
          <th>Brand</th>
          <th>Availability</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of paginatedData">
          <td>{{ product.id }}</td>
          <td>{{ product.title }}</td>
          <td>{{ product.category }}</td>
          <td>\${{ product.price }}</td>
          <td>{{ product.stock }}</td>
          <td>{{ product.rating }}</td>
          <td>{{ product.brand }}</td>
          <td>{{ product.availabilityStatus }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Bottom row: Show dropdown left, Pagination right -->
  <div class="d-flex justify-content-between align-items-center mt-2">
    <!-- Showing dropdown -->
    <div>
      Show
      <select class="form-select d-inline-block w-auto" (change)="onItemsPerPageChange($event)">
        <option *ngFor="let option of itemsOptions" [value]="option" [selected]="option === itemsPerPage">
          {{ option }}
        </option>
      </select>
      entries
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
        </li>

        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1"
        >
          <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
        </li>
      </ul>
    </nav>
  </div>
</div>
