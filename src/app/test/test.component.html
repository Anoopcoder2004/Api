<div class="floating-label">
  <div class="input-box">
    <input type="number" id="workingHours" placeholder=" " min="0" max="999" step="1" required />
    <div class="lab">
      <label for="workingHours">Working Hourssss</label>
    </div>
    <div class="spinner">
      <i class="bi bi-chevron-up" (click)="incrementValue()"></i>
      <i class="bi bi-chevron-down" (click)="decrementValue()"></i>
    </div>
  </div>
</div>
