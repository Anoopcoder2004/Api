<div class="page">
  <h3>Table Search</h3>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
   <th class="th-search">
  Name
  <button class="search-btn" (click)="toggleSearch()">🔍</button>

  <!-- Search dropdown -->
  <div class="search-box" [class.active]="showSearch">
    <ng-select
      [items]="options"
      bindLabel="name"
      bindValue="id"
      [multiple]="true"
      placeholder="Select options"
      [(ngModel)]="selectedOptions"
      [searchable]="true"
      [closeOnSelect]="false"
      [clearable]="true">
    </ng-select>
  </div>
</th>

      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.id }}</td>
        <td>{{ row.name }}</td>
      </tr>
    </tbody>
  </table>
</div>
<app-child 
  #childComp 
  (deleteRequest)="onDeleteRequest($event)">
</app-child>

<div class="modal-backdrop" *ngIf="showDeleteModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h5>Confirm Delete</h5>

      <p>
        Are you sure you want to delete 
        <strong>{{ rowToDelete }}</strong>?
      </p>

      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" (click)="cancelDelete()">
          Cancel
        </button>

        <button class="btn btn-danger" (click)="confirmDelete(childComp)">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
