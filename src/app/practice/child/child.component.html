<div>
  <h4>User Table</h4>
  <button class="btn btn-primary mb-2" (click)="openAddModal()">Add User</button>

  <table class="table table-bordered table-sm">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.id }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.status }}</td>
        <td>
          <!-- Request delete to parent -->
          <button class="btn btn-danger btn-sm" (click)="requestDelete(row.name)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="rows.length === 0">No users found.</p>

  <!-- Add Modal -->
  <div class="modal-backdrop" *ngIf="showAddModal">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <h5>Add User</h5>

        <div class="mb-2">
          <label>Name</label>
          <input [(ngModel)]="newName" class="form-control" placeholder="Enter name" />
        </div>

        <div class="mb-2">
          <label>Status</label>
          <select [(ngModel)]="newStatus" class="form-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-secondary" (click)="closeAddModal()">Cancel</button>
          <button class="btn btn-primary" (click)="addRow()">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>
