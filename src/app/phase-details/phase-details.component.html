  <h2 class="text-green">Phases for Project ID: {{ projectId }}</h2>

  <table class="green-table table-striped">
    <thead>
      <tr>
        <th>Phase Code</th>
        <th>Phase Name</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let phase of phases" class="hover-light-green">
        <td>{{ phase.phaseCode }}</td>
        <td>{{ phase.phaseName }}</td>
        <td>{{ phase.startDate | date }}</td>
        <td>{{ phase.endDate | date }}</td>
        <td>
          <span class="badge badge-green-status">{{ phase.status }}</span>
        </td>
        <td>
          <button mat-icon-button color="primary" (click)="viewJobs(phase.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="editPhase(phase.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletePhase(phase.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
