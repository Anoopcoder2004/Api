<div class="container">
  <h2>Phases for Project ID: {{ projectId }}</h2>

  <mat-card *ngIf="loading" class="loading-card">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading phases...</p>
  </mat-card>

  <mat-card *ngIf="!loading && phases.length === 0" class="empty-card">
    <p>No phases found for this project.</p>
  </mat-card>

  <mat-card *ngIf="!loading && phases.length > 0" class="phase-card">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Phase Code</th>
          <th>Phase Name</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let phase of phases">
          <td>{{ phase.phaseCode }}</td>
          <td>{{ phase.phaseName }}</td>
          <td>{{ phase.startDate | date }}</td>
          <td>{{ phase.endDate | date }}</td>
          <td>{{ phase.status }}</td>
          <td>
            <button mat-icon-button color="primary" (click)="viewJobs(phase.id)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="editPhase(phase.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletePhase(phase.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </mat-card>
</div>
