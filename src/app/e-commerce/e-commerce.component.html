
<div class="container my-5">
  <div class="row g-4">

    <!-- Product Card 1 -->
    <div *ngFor="let product of products" class="col-md-4">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden h-100">
        <div class="position-relative">
          <img src="{{product.image}}" class="card-img-top" alt="{{product.title}}">
        </div>
        <div class="card-body p-4">
          <h5 class="card-title fw-bold">{{product.title}}</h5>
          <p class="text-muted small">{{product.category}}</p>
          <div class="mb-2 text-warning">★★★★☆</div>
          <div class="d-flex align-items-center mb-3">
            <h4 class="mb-0 text-success fw-bold me-2">{{product.price}}</h4>
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-dark rounded-pill">Add to Cart</button>
            <button class="btn btn-outline-secondary rounded-pill">Wishlist</button>
          </div>
        </div>
      </div>
    </div>

   
   

  </div>
</div>
